name: 'UTF Wiseconnect test library'



test_cases:

- test_case_id: 'get_ram_dump_full'
  labels: [ 'ram_dump' ]
  test_id: 'get_ram_dump_full::1'
  test_module: 'test_cases/test_ram_dump.py'
  test_function: 'test_ram_dump'
  test_params:
  -   name: start_address
      value: 0
  -   name: end_address
      value: 65
  test_markers:
  - pytest.mark.dut("rs9116_sapi")

