[pytest]
# This is the log message formatter
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S
log_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# This is added to turn on -verbose mode by default and also
# to add the ability for pytest-html to create html reports - addopts is NOT a typo...
# This requires the installation of pytest-html on the executor
addopts = -v --html=.//reports//pytest-report.html --self-contained-html --junitxml=.//reports//junit_report.xml -p utf_core.conftest
