firmware:
  efx32:
    load_binary:
      file_name: &firmware_file_anchor '{{ binary_file_name }}'
    write_firmware:
      file_name: test_agent_si91x.rps

firmware_version_file: *firmware_file_anchor
# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    # List of markers for test cases that need a dedicated test agent firmware
    test_ipv6:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: 'test_agent_si91x_ipv6.rps'

    test_twt_sta:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: 'test_agent_si91x_twt.rps'

    test_azure:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: 'test_agent_si91x_aws_mem_3.rps'

artifacts:
  test_agent_si91x:
    filename: test_agent_si91x.rps
    name: test_agent_si91x
    extension: .rps
    metadata:
      app_name: test_agent_si91x
      branch: ${BRANCH_NAME}
      build_number: ${SDK_BUILD_NUM}

  test_agent_si91x_ipv6:
    filename: test_agent_si91x_ipv6.rps
    name: test_agent_si91x_ipv6
    extension: .rps
    metadata:
      app_name: test_agent_si91x_ipv6
      branch: ${BRANCH_NAME}
      build_number: ${SDK_BUILD_NUM}

  test_agent_si91x_twt:
    filename: test_agent_si91x_twt.rps
    name: test_agent_si91x_twt
    extension: .rps
    metadata:
      app_name: test_agent_si91x_twt
      branch: ${BRANCH_NAME}
      build_number: ${SDK_BUILD_NUM}

  test_agent_si91x_aws_mem_3:
    filename: test_agent_si91x_aws_mem_3.rps
    name: test_agent_si91x_aws_mem_3
    extension: .rps
    metadata:
      app_name: test_agent_si91x_aws_mem_3
      branch: ${BRANCH_NAME}
      build_number: ${SDK_BUILD_NUM}