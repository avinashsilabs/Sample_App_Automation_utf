firmware:
    efx32:
      load_binary:
        file_name: &secure_firmware_file_anchor encrypted_1_SiWG917-B.2.14.4.0.0.1.rps # prefixed original firmware file name with prefix field value in 24
      write_firmware:
        file_name: &secure_test_agent_file_anchor encrypted_1_test_agent_soc_ifc1fc_bc0a23d8cb_generic192k.rps # prefixed original test_agent file name with prefix field value in 30

secure_firmware_config:
  perform_secure_encrypt: True
  generate_keys : False
  base_keys_path:  /app/manifest/secure_firmware_keys/
    
  conversion:
    - file_name: &firmware_file_anchor SiWG917-B.2.14.4.0.0.1.rps # original firmware file name
      TA: True
      config:
          - prefix: encrypted_1 # the output file will be prefixed with this name
            key: ota_key_1.txt
            sign: ta_private_key_1.pem

          - prefix: encrypted_2 # the output file will be prefixed with this name
            key: ota_key_2.txt
            sign: ta_private_key_2.pem

          - prefix: encrypted_3 # the output file will be prefixed with this name
            key: ota_key_2.txt
            sign: ta_private_key_2.pem


    - file_name: &test_agent_file_anchor test_agent_soc_ifc1fc_bc0a23d8cb_generic192k.rps  # original test agent file name
      TA: False
      config:
          - prefix: encrypted_1 # the output file will be prefixed with this name
            key: m4_ota_key_1.txt
            sign: m4_private_key_1.pem

          - prefix: encrypted_2 # the output file will be prefixed with this name
            key: m4_ota_key_2.txt
            sign: m4_private_key_2.pem

          - prefix: encrypted_3 # the output file will be prefixed with this name
            key: m4_ota_key_3.txt
            sign: m4_private_key_3.pem

firmware_version_file: *firmware_file_anchor
# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    # List of markers for test cases

    firmware_security_encrypted_1:
      # List of devices and their firmware images for this marker
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename:
          load_binary:
            file_name: *secure_firmware_file_anchor
          write_firmware: 
            file_name: *secure_test_agent_file_anchor
        is_secure: True


    wifitest:
    # List of devices and their firmware images for this marker
    - device_type: 'rs911x'
      device_subtype: 'rs9116'
      filename:
        load_binary:
          file_name: 'SiWG917-A.1.0.0.0.23.bin'
        write_firmware:
          file_name: '917_ccp/generic_test_agent_without_aws.rps'

    test_concurrent_mode:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '917_ccp/concurrent_test_agent.rps'

    test_ap_ht_caps:
