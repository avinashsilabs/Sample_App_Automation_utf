firmware:
    efx32:
      load_binary:
        file_name: &firmware_file_anchor 'SiWG917-B.2.12.2.1.0.9.rps'
      write_firmware:
        file_name: &test_agent_file_anchor 'test_agent_soc_rcf2_daf57c7579_generic192k.rps'

perform_secure_encrypt: True

secure_firmware_config:
  init:
     default_mbr: /app/manifest/secure_firmware_keys/ta_mbr_SiWG917M111MGTBA.bin

  conversion:
    - file_name: *firmware_file_anchor # &firmware_file_anchor defined in line 4
      TA: True
      config:
          - prefix: level_1 # the output file will be prefixed with this name
            key: /app/manifest/secure_firmware_keys/level_1/keys.json
            sign: /app/manifest/secure_firmware_keys/level_1/keys/ta_private_key.pem

          - prefix: level_2
            key: /app/manifest/secure_firmware_keys/level_2/keys.json
            sign: /app/manifest/secure_firmware_keys/level_2/keys/ta_private_key.pem

          - prefix: level_3
            key: /app/manifest/secure_firmware_keys/level_3/keys.json
            sign: /app/manifest/secure_firmware_keys/level_3/keys/ta_private_key.pem

    - file_name: *test_agent_file_anchor # &test_agent_file_anchor should be defined in line 6
      TA: False
      config:
          - prefix: level_1
            key: /app/manifest/secure_firmware_keys/level_1/keys.json
            sign: /app/manifest/secure_firmware_keys/level_1/keys/m4_private_key.pem

          - prefix: level_2
            key: /app/manifest/secure_firmware_keys/level_2/keys.json
            sign: /app/manifest/secure_firmware_keys/level_2/keys/m4_private_key.pem

          - prefix: level_3
            key: /app/manifest/secure_firmware_keys/level_3/keys.json
            sign: /app/manifest/secure_firmware_keys/level_3/keys/m4_private_key.pem

firmware_version_file: *firmware_file_anchor
# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    # List of markers for test cases

    firmware_security_level_1:
      # List of devices and their firmware images for this marker
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename:
          load_keys:
            arguments:
              mbr_bin_file: /app/manifest/secure_firmware_keys/ta_mbr_SiWG917M111MGTBA.bin
              keys_json_file: /app/manifest/secure_firmware_keys/level_1/keys.json
              security_level_file: /app/manifest/secure_firmware_keys/level_1/config.json
          load_binary:
            file_name: 'level_1_SiWG917-B.2.12.2.1.0.9.rps'
          write_firmware:
            file_name: 'level_1_test_agent_soc_rcf2_daf57c7579_generic192k.rps'
        is_secure: True

    firmware_security_level_2:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename:
          load_keys:
            arguments:
              mbr_bin_file: /app/manifest/secure_firmware_keys/ta_mbr_SiWG917M111MGTBA.bin
              keys_json_file: /app/manifest/secure_firmware_keys/level_2/keys.json
              security_level_file: /app/manifest/secure_firmware_keys/level_2/config.json
          load_binary:
            file_name: 'level_2_SiWG917-B.2.12.2.1.0.9.rps'
          write_firmware:
            file_name: 'level_2_test_agent_soc_rcf2_daf57c7579_generic192k.rps'
        is_secure: True

    firmware_security_level_3:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename:
          load_keys:
            arguments:
              mbr_bin_file: /app/manifest/secure_firmware_keys/ta_mbr_SiWG917M111MGTBA.bin
              keys_json_file: /app/manifest/secure_firmware_keys/level_3/keys.json
              security_level_file: /app/manifest/secure_firmware_keys/level_3/config.json
          load_binary:
            file_name: 'level_3_SiWG917-B.2.12.2.1.0.9.rps'
          write_firmware:
            file_name: 'level_3_test_agent_soc_rcf2_daf57c7579_generic192k.rps'
        is_secure: True

    wifitest:
    # List of devices and their firmware images for this marker
    - device_type: 'rs911x'
      device_subtype: 'rs9116'
      filename:
        load_binary:
          file_name: 'SiWG917-A.1.0.0.0.23.bin'
        write_firmware:
          file_name: '917_ccp/generic_test_agent_without_aws.rps'

    test_concurrent_mode:
