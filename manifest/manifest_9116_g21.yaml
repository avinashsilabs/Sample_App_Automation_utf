firmware:
  rs911x: &firmware_file_anchor 'RS9116W.2.7.1.0.5.rps'
  efx32: '9116_brd4180b/generic_test_agent_without_aws.hex'

firmware_version_file: *firmware_file_anchor
# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    # List of markers for test cases
    wifitest:
    # List of devices and their firmware images for this marker
    - device_type: 'rs911x'
      device_subtype: 'rs9116'
      filename: 'RS9116W.2.7.1.0.5.rps'
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/generic_test_agent_without_aws.hex'

    test_concurrent_mode:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/concurrent_test_agent.hex'

    test_multi_gatt_conn:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/multi_gatt_generic_test_agent.hex'

    test_wlan_powersave_mode3_ulp:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/generic_test_agent_without_aws_powersave3.hex'

    test_wlan_powersave_mode1:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/sqa_test_agent_gpio_lp.hex'

    test_wlan_powersave_mode2_lp:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/generic_test_agent_lp_gpio_based_pwr_save.hex'

    test_wlan_powersave_mode3_lp:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/generic_test_agent_lp_msg_based_pwr_save.hex'

    test_ap_ht_caps:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename: '9116_brd4180b/ap_htcaps_enable.hex'

    test_wlan_aws_enable:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: '9116_brd4180b/aws_test_agent.hex'

    test_wlan_rts:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: '9116_brd4180b/rts_test_agent.hex'

    test_wlan_powersave_mode2_without_ram_ret:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: '9116_brd4180b/generic_test_agent_wt_aws_wt_ram_ret.hex'