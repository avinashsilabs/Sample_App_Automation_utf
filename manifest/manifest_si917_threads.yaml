firmware:
  efx32:
    load_binary:
      file_name: &firmware_file_anchor 'SiWG917-A.2.9.0.0.8.bin'
    load_rps:
      file_name: 'test_agent-brd4325a-si91x-gcc_arm.rps'

firmware_version_file: *firmware_file_anchor
# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    wifitest:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename:
        write_firmware:
          file_name: test_agent-brd4325a-si91x-gcc_arm.rps
        load_binary:
          file_name: SiWG917-A.2.9.0.0.8.bin
