firmware:
  efx32:
    load_binary:
      file_name: SiWG917-A.1.0.0.0.13.bin
    write_firmware:
      file_name: sqa_test_agent-brd4325a-gcc_arm+wifi.rps



# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    wifitest:
    - device_type: 'efx32'
      device_subtype: 'efr32'
      filename:
        write_firmware:
          file_name: sqa_test_agent-brd4325a-gcc_arm+wifi.rps
        load_binary:
          file_name: SiWG917-A.1.0.0.0.6.bin