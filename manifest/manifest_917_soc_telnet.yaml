firmware:
  efr32_4180b_Si917_1:
    load_binary:
      file_name: &firmware_file_anchor 'SiWG917-B.2.14.5.2.0.7.rps'
    write_firmware:
      file_name:  &test_agent_anchor 'test_agent_soc_3.5.2_CF3_generic_AWS_SSL_192k_18SEP_25.rps'

  efr32_4180b_Si917:
    load_binary:
      file_name: *firmware_file_anchor
    write_firmware:
      file_name: *test_agent_anchor

firmware_version_file: *firmware_file_anchor
# List of devices to be reset when needed
# reset of efx32 runs reset sequence for rs911x so no need to reset rs911x
reset: [efx32]

firmware_applications:
    # List of markers for test cases
    test_firmware_loader:
      - device_type: 'efx32'
        device_subtype: 'efr32_4180b_Si917'
        filename:
          load_binary:
            file_name: 'SiWG917-B.2.14.4.0.0.1.rps'
          write_firmware:
            file_name: 'test_agent_soc_tp_342_cf2_480.rps'

      - device_type: 'efx32'
        device_subtype: 'efr32_4180b_Si917_1'
        filename:
          load_binary:
            file_name: 'SiWG917-B.2.14.4.0.0.1.rps'
          write_firmware:
            file_name: 'test_agent_soc_tp_342_cf2_480.rps'

    test_480K_M4SS_192K:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: 'test_agent_twt_410rc3_110L_480.rps'

    test_416K_M4SS_256K:
      - device_type: 'efx32'
        device_subtype: 'efr32'
        filename: 'test_agent_twt_410rc3_110L_416.rps'

    test_352K_M4SS_320K:
      - device_type: 'efx32'
        device_subtype: 'efr32_4180b_Si917'
        filename: 'test_agent_410FC_pw_352.rps'