
name: "Wi-Fi UTF Integration Test Library"

test_cases:
#
# ASUS RT AX3000 tests
#

- test_case_id: 'test_asus_rt_ax3000_lb_1'
  labels: ['access_point_tests']
  test_id: 'test_asus_rt_ax3000_lb_1::1'
  test_module: 'test_cases/test_generic_ap.py'
  test_class: 'TestAccessPointConfig'
  test_function: 'test_wifi_ap_configuration'
  test_params:
  - name: security
    value: 'WPA2'
  - name: standard
    value: 'n'
  - name: channel
    value: 6
  - name: cipher
    value: 'TKIP_AES'

  test_markers:
  - pytest.mark.start_state("wifi_access_point", wifi=None)
  - pytest.mark.end_state("wifi_access_point", wifi=None)
  - pytest.mark.wifi_access_point("asus_rt_ax3000_ap")
  - pytest.mark.wifi_client("raspi_wifi")

