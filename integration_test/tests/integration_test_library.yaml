#
# AWS IoT
#

- test_case_id: 'test_aws_python_client'
  labels: ['aws_iot']
  test_id: 'test_aws_python_client::1'
  test_module: 'test_cases/test_aws_iot.py'
  test_function: 'test_python_client'
  test_markers:
  - pytest.mark.dut("rs9116_sapi")
  - pytest.mark.wifi_access_point("dlink810_ap")

- test_case_id: 'test_aws_device_shadow'
  labels: ['aws_iot']
  test_id: 'test_aws_device_shadow::1'
  test_module: 'test_cases/test_aws_iot.py'
  test_function: 'test_aws_device_shadow'
  test_markers:
  - pytest.mark.dut("rs9116_sapi")
  - pytest.mark.wifi_access_point("dlink810_ap")
  - |
      pytest.mark.config(
            "wifi_dut",
            wifi={
                "tcpip_features": RS9116TCPIPFeatureBitMap.Default
                | RS9116TCPIPFeatureBitMap.SSL
                | RS9116TCPIPFeatureBitMap.LoadSSLCertificatesToRAM
                | RS9116TCPIPFeatureBitMap.LoadPublicPrivateCerts,
                # Note that SSL cert bypass is required to avoid SSL handshake error.
                # It is unclear if this is a bug in the AWS SAPI network wrapper
                # or in the 9116 firmware
                "ext_tcpip_features": RS9116ExtTCPIPFeatureBitMap.SSLCertBypass,
            },
        )

