  test_function: 'test_async_rejoin_errors_using_wait_for_event'
  test_markers:
  - pytest.mark.dut("rs9116_sapi")
  - pytest.mark.wifi_access_point("raspi_wifi")
  - pytest.mark.start_state("dut", device="reset", wifi="init")


