  test_module: 'test_cases/test_http.py'
  test_function: 'test_http_server_and_dut_client'
  test_params:
  - name: index_path
    value: index_long_crlf.html
  test_markers:
  - pytest.mark.dut("rs9116_at")
  - pytest.mark.wifi_access_point("raspi_wifi")
  - pytest.mark.http_server("raspi_lighttpd")
  - |
    pytest.mark.config(
        "wifi_dut",
        wifi={
            "tcpip_features": RS9116TCPIPFeatureBitMap.Default
                              | RS9116TCPIPFeatureBitMap.SSL
                              | RS9116TCPIPFeatureBitMap.LoadSSLCertificatesToRAM
                              | RS9116TCPIPFeatureBitMap.LoadPublicPrivateCerts,
