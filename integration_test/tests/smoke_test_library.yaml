name: "Smoke Test Library"
root_path: 'tests'

test_cases:
#
# Async Event Tests
#

- test_case_id: 'test_async_rejoin_errors_using_queue-at_mode'
  labels: ['async_events']
  test_id: 'test_async_rejoin_errors_using_queue-at_mode::1'
  test_module: 'test_cases/test_async_events.py'
  test_function: 'test_async_rejoin_errors_using_queue'
  test_markers:
  - pytest.mark.dut("rs9116_at")
  - pytest.mark.wifi_access_point("raspi_wifi")
  - pytest.mark.start_state("dut", device="reset", wifi="init")

- test_case_id: 'test_async_rejoin_errors_using_wait_for_event-sapi_mode'
  labels: ['async_events']
  test_id: 'test_async_rejoin_errors_using_wait_for_event-sapi_mode::1'
