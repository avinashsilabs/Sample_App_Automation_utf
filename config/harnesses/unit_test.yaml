devices:
  rs9116_mock:
    interfaces:
      wifi:
        type: 'mocks.mock_9116'
        supports: ['wifi_client', 'wifi_ap']

  rs9116_at:
      type: 'rs911x'
      defaults:
          cli_transport: 'uart'
      interfaces:
          uart:
              type: 'mocks.mock_at_bus'
          gpio_uart:
              type: 'mocks.mock_at_bus'
          wifi:
              type: 'cli.rs_at_commands'

  rs9116_sapi:
      type: 'rs911x'
      defaults:
          cli_transport: 'uart'
      interfaces:
          uart:
              type: 'mocks.mock_sapi_bus'
          gpio_uart:
              type: 'mocks.mock_sapi_bus'
          wifi:
              type: 'cli.rs_sapi_commands'

  mock_airpcap:
    interfaces:
      mock_shell:
        type: 'shell.mock_shell'
        commands:
          - command: "sudo chmod 777 .*"
            response: [0, "", "" ]
            regex: true
          - command: "sudo mkdir -p .*"
            response: [0, "", "" ]
            regex: true
          - command: "sudo pkill -9 tshark"
            response: [0, "", ""]
          - command: "tshark --version"
            response: [ 1, "", "" ]
          - command: "echo $USER"
            response: [ 0, "pi", "" ]
          - command: "sudo apt update && sudo apt install -y tshark && sudo usermod -a -G wireshark pi"
            response: [ 0, "", "" ]
          - command: "sudo chmod a\\+r [\\w.]+"
            response: [ 0, "", "" ]
            regex: true
          - command: "sudo ifconfig [\\w]+ down"
            response: [0, "", ""]
            regex: true
          - command: "sudo iwconfig [\\w]+ channel [0-9]+"
            response: [ 0, "", "" ]
            regex: true
          - command: "sudo iwconfig [\\w]+ mode monitor"
            response: [ 0, "", "" ]
            regex: true
          - command: "sudo iwconfig [\\w]+ mode managed"
            response: [ 0, "", "" ]
            regex: true
          - command: "sudo ifconfig [\\w]+ up"
            response: [ 0, "", "" ]
            regex: true
          - command: "tshark -i [\\w]+ (-f \"[\\w]+\")? -w [\\w.]+ &"
            response: [ 0, "", "" ]
            regex: true
      capture:
        default:
        type: 'wifi.sniffer.tshark'
        shell: 'mock_shell'
        interface: 'wlx008048770294'

  mock_browser_ap:
    interfaces:
      wifi:
        type: 'wifi.access_points.mock_browser_ap'
        supports: 'wifi_ap'
        ip_address: '10.4.1.92'
        web_ui_port: 8080
        admin_password: 'dlink810l'
        security: WPA2
        ssid: 'TESTTESTTESTy'
        passphrase: 'thisisatestneworky'

  mock_linux_ap:
    interfaces:
      mock_shell:
        type: 'shell.mock_shell'
        commands:
          - command: "sudo hostapd -B hostapd.conf"
            response: [0, "", ""]
          - command: "sudo ifconfig [\\w]+ [\\w.]+ netmask 255\\.255\\.255\\.0"
            regex: true
            response: [0, "", ""]
          - command: "sudo pkill hostapd"
            response: [0, "", ""]
          - command: "sudo ifconfig [\\w]+ 0\\.0\\.0\\.0"
            regex: true
            response: [0, "", ""]


      wifi:
        type: 'wifi.access_points.linux'
        shell: 'mock_shell'
        ssid: 'TESTTESTTESTx'
        interface: wlan0
        supports: 'wifi_ap'

  static_ap:
      interfaces:
          wifi:
              type: 'wifi.access_points.static'
              passphrase: 'static_passphrase'
              ssid: 'static_ssid'
              security: WPA2
              channel: 7

  static_ap_with_switch:
      interfaces:
          mock_pdu_switch:
              type: 'mocks.generic_mock'
          wifi:
              type: 'wifi.access_points.static'
              passphrase: 'static_passphrase'
              ssid: 'static_ssid'
              security: WPA2
              channel: 7
              pdu_switch: 'mock_pdu_switch'
              turn_on_delay: 59

  mock_bt_device:
    interfaces:
      bluetooth:
        type: 'mocks.generic_mock'

  mock_bt_device_2:
      interfaces:
          bluetooth:
              type: 'mocks.generic_mock'


  composite_device:
      interfaces:
          wifi: 'linux:wifi'
      devices:
          linux:
              interfaces:
                  mock_shell:
                      type: 'shell.mock_shell'
                  wifi:
                      type: 'wifi.access_points.linux'
                      shell: 'mock_shell'

  complex_device_parent:
      interfaces:
          bluetooth: 'child_device:grandchild_device:bluetooth'
          wifi:
              type: 'wifi.access_points.linux'
      devices:
          child_device:
              interfaces:
                  wifi:
                      type: 'wifi.access_points.linux'
              devices:
                  grandchild_device:
                      interfaces:
                          grandchild_shell:
                              type: 'shell.shell'
                          bluetooth:
                              type: 'bluetooth.pybluez'
                              shell: 'grandchild_shell'
                          # reference to parent's wifi interface
                          wifi: '..:wifi'
                          # reference to parent's parent's wifi interface
                          second_wifi: '..:..:wifi'
                          # alternative syntax for parent's parent's wifi interface
                          third_wifi: '...:wifi'
                          # reference to this device's bluetooth interface
                          ref_to_bluetooth: '.:bluetooth'

  50pa500_mock_attenuator:
      interfaces:
          attenuator:
              type: 'attenuator.50pa500'
              shell: 'mock_shell'
          mock_shell:
              type: 'shell.mock_shell'
              commands:
              -   command: "REBOOT\r"
                  response: [ 0, "", "" ]
              -   command: "SA 1 10\r"
                  response: [ 0, "", "" ]
              -   command: "RA 1\r"
                  response: [0, "Atten #1 = 10dB", ""]

  50pa500_real_attenuator:
      interfaces:
          attenuator:
              type: 'attenuator.50pa500'
              shell: 'telnet_shell'
          telnet_shell:
              type: 'shell.telnet_shell'
              remote: '10.4.1.56'
              port: 21
              username: null
              password: null

  iperf:
      interfaces:
          net_perf:
              type: 'iperf'
              # to zip all the iperf output files
              zip_results: 'Y'

defaults:
  dut: 'rs9116_mock'
  wifi_access_point: 'mock_browser_ap'
  wifi_sniffer: 'mock_airpcap'
  serial:
    baud: 115200
  wifi:
    ssid: 'TESTTESTTEST'
    security: WPA
    channel: 6
    passphrase: 'thisisatestnework'
  bt_client: 'mock_bt_device'
  bt_clients:
  - 'mock_bt_device'
  - 'mock_bt_device_2'
  ble_clients:
  - 'mock_bt_device'
  - 'mock_bt_device_2'
  rf_attenuator: '50pa500_attenuator'
  
  net_perf_client: 'iperf'

  net_perf:
      server_options:
          # seconds between periodic bandwidth reports
          interval: 1
          # time in seconds to listen for new connections as well as to receive traffic (default not set)
          time: 30
      client_options:
          # used only for UDP as there is no limit imposed while TCP
          bandwidth: 0.1M
          interval: 1
          #time in seconds to transmit for (default 10 secs)
          time: 30
      host:
          TCP:
              port: 5201
          UDP:
              port: 5202
      device:
          # currently, solution is reading it as IP address of Device
          # ip_address: ""
          TCP:
              port: 1234
              data_len: 1460
          UDP:
              port: 1235
              # bytes, number of bytes we want device to send to server (host) in each iteration
              data_len: 1472

logger:
  DLink810AccessPoint: DEBUG

start_state:
    wifi_access_point:
        wifi: 'ap_enabled'
end_state:
    wifi_access_point:
        wifi: 'ap_disabled'
