                type: 'rpc.rpc_client'
                forward_to: 'raspi_wifi_client:wifi'
                host: 'docker_host'


        # this section represents the harness configuration for the server side.
        # the devices and interfaces here will be created on-demand by the server
        # and can be used by the rpc_client-based interfaces above
        harness:
            devices:
                # iperf/net_perf server device for running iperf server
                raspi_iperf_server:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        net_perf:
                            type: 'iperf'
                            zip_results: 'Y'
                            server_options:
                                interval: 1
                                time: 30
                            client_options:
                                bandwidth: 60M
                                interval: 1
                                time: 30
                            host:
                                TCP:
                                    port: 5001
                                UDP:
                                    port: 5002
                            device:
                                TCP:
                                    port: 5001  # Match server port for loopback
                                    data_len: 1460
                                UDP:
                                    port: 5002  # Match server port for loopback
                                    data_len: 1472

                # iperf/net_perf client device for running iperf client
                raspi_iperf_client:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        net_perf:
                            type: 'iperf'
                            zip_results: 'Y'
                            server_options:
                                interval: 1
                                time: 30
                            client_options:
                                bandwidth: 60M
                                interval: 1
                                time: 30
                            host:
                                TCP:
                                    port: 5001
                                UDP:
                                    port: 5002
                            device:
                                TCP:
                                    port: 5001  # Match server port for loopback
                                    data_len: 1460
                                UDP:
                                    port: 5002  # Match server port for loopback
                                    data_len: 1472

                # wifi client device for network operations
                raspi_wifi_client:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        wifi:
                            type: 'wifi.access_points.linux'
                            shell: 'linux_shell'
