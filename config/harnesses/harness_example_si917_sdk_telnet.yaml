    # This represents another access point configuration.
    raspi_wifi:
        interfaces:
            linux_shell:
                type: 'shell.ssh_shell'
                remote: '192.168.150.180'
                username: pi
                password: raspberry
                use_paramiko_expect: false
            mqtt:
                type: 'mqtt.client.rpc_client'
                forward_to: 'secondary_raspi:mqtt'
                host: 'docker_host'
            tc:
                type: 'traffic_controller.tc_cli'
                shell: 'linux_shell'
                interface: 'eth1'
            wifi:
                # The 'wifi.access_points.linux' device type represents a linux-based access point
                # running hostapd to create a soft AP
                type: 'wifi.access_points.linux'
                shell: 'linux_shell'
                ssid: 'TESTTESTTEST'
                passphrase: 'thisisatestnetwork'
                supports: [ 'wifi_ap', 'wifi_client' ]
                interface: 'eth0' #'eth3' #'wlan0' #'eth1'
                #v6_interface: 'eth1'
                standard: 'n'
                ip_address: '192.168.0.1'
                region: 'Japan'
            wiseconnect_ui:
                type: web.wiseconnect_web_login
                src_dir: 'utf_wiseconnect'
                mode: 'Client'
                band: '2.4'
                is_security_enable: True
                ssid: 'TESTTESTTEST'
                passphrase: 'thisisatestnetwork'
                firmware_file_path: '/app/manifest/RS9116W.2.6.0.17.rps'
            # the docker_host interface specifies which device to connect to, login credentials, and
            # the docker image to run
            docker_host:
                type: 'docker'
                ip_address: '192.168.150.180'
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True
        # this section represents the harness configuration for the server side.
        # the devices and interfaces here will be created on-demand by the server
        # and can be used by the rpc_client-based interfaces above
        harness:
            devices:
                secondary_raspi:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        mqtt:
                            type: 'mqtt.client.paho_client'
                            disable_certificate_verification: True
            defaults: { }

    raspi_wifi_ssh:
        interfaces:
            linux_shell:
                type: 'shell.ssh_shell'
                remote: 10.207.18.55
                username: pi
                password: raspberry
                use_paramiko_expect: false
            wifi:
                type: 'wifi.access_points.linux'
                shell: 'linux_shell'
                ssid: 'TESTTESTTEST'
                passphrase: 'thisisatestnetwork'
                supports: [ 'wifi_ap', 'wifi_client' ]
                interface: 'wlan0'
                standard: 'n'
                ip_address: '192.168.0.152'

            wiseconnect_ui:
                type: web.wiseconnect_web_login
