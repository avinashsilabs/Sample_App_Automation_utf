    raspi_ble_client:
        interfaces:
            linux_shell:
                type: 'shell.shell'
            bluetooth:
                type: 'bluetooth.bluez'
                shell: 'linux_shell'


    raspi_multicast:
        interfaces:
            docker_host:
                type: 'docker'
                ip_address: '192.168.150.180'
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True

            multicast:
                type: 'multicast.rpc_client'
                forward_to: 'raspi_multicast:multicast'
                host: 'docker_host'
        harness:
            devices:
                raspi_multicast:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        multicast:
                            type: 'multicast.multicast_socket'
                            ip_version: 4
                            multicast_ip: '239.255.255.250'
                            multicast_ip2: '239.255.255.250'
                            dut_local_socket: 5001
                            destination_socket: 5002
                            ttl: 32
                            time: 30
                            buffer_length: 1470
                            no_of_pkts: 500
                            multicast_ip_mac_map: '01:00:5e:7f:ff:fa'
                            multicast_ip2_mac_map1: '01:00:5e:7f:ff:fa'
                            interface: 'eth0'

            defaults: { }

    raspi_ip_socket:
            interfaces:
                # the docker_host interface specifies which device to connect to, login credentials, and
                # the docker image to run
                docker_host:
                    type: 'docker'
                    ip_address: '192.168.150.180'
                    image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                    username: pi
                    password: 'raspberry'
                    skip_rabbitmq_check: True

                socket:
                    type: 'socket.rpc_client'
                    forward_to: 'raspi_ip_socket:socket'
                    host: 'docker_host'
                    ip_socket_type: 'ip_socket'
            harness:
                devices:
                    raspi_ip_socket:
                        interfaces:
                            linux_shell:
                                type: 'shell.shell'
                            socket:
                                type: 'socket.ip_socket'
                                ip_version: 4
                                dut_local_socket: 5001
                                destination_socket: 5001
                                server_ip: '192.168.150.180'
                                time: 30
                                buffer_length: 1470
                                no_of_pkts: 500
                                socket_type: 0  #0- TCP, 1 - UDP
                                interface: 'eth0'

                defaults: { }

    ip_socket_factory:
        interfaces:
            docker_host:
                type: 'docker'
                ip_address: '192.168.150.180'
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True

            socket:
                type: 'socket.rpc_client'
                forward_to: 'ip_socket_factory:socket'
                host: 'docker_host'
                ip_socket_type: 'ip_socket_factory'
        harness:
            devices:
                ip_socket_factory:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        socket:
                            type: 'socket.ip_socket_factory'
                            interface: 'eth0'

            defaults: { }

    raspi_multi_socket:
        interfaces:
            socket:
                type: 'socket.ip_multi_sockets'
                ip_version: 4
                dut_local_socket: 5001
                destination_socket: 5001
                server_ip: '192.168.100.50'
                time: 30
                buffer_length: 1470
                no_of_pkts: 500
                socket_type: 1  #0- TCP, 1 - UDP
                interface: 'eth1'

    raspi_ip_remote_socket:
        interfaces:
            socket:
                type: 'socket.ip_remote_socket'
                ip_version: 4
                dut_local_socket: 5001
                destination_socket: 5001
                server_ip: '192.168.100.50'
                time: 30
                buffer_length: 1470
                no_of_pkts: 500
                socket_type: 0   #0- TCP, 1 - UDP
                interface: 'eth1'
                primary_interface: 'eth1'
                primary_port: 5001

    raspi_bt_client:
        interfaces:
            linux_shell:
                type: 'shell.shell'
            bluetooth:
                type: 'bluetooth.pybluez'
                shell: 'linux_shell'

    # this configuration entry represents a secondary raspberry pi device that we will connect
    # to through via RPC
    secondary_raspi_bt_client:
        interfaces:
            # the docker_host interface specifies which device to connect to, login credentials, and
            # the docker image to run
            docker_host:
                type: 'docker'
                ip_address: '10.207.18.146'
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True

            # these are the RPC-enabled interfaces that will forward all method and property access
            # calls over to the respective instance on the server
            shell:
                type: 'rpc.rpc_client'
                # the 'forward_to' property specifies the destination device and interface on the server
                # the format is 'device:interface'
                forward_to: 'raspi_bt_client:linux_shell'
                host: 'docker_host'

            bluetooth:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_bt_client:bluetooth'
                host: 'docker_host'

            mqtt:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_bt_client:mqtt'
                host: 'docker_host'

            wifi:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_bt_client:wifi'
                host: 'docker_host'

        # this section represents the harness configuration for the server side.
        # the devices and interfaces here will be created on-demand by the server
        # and can be used by the rpc_client-based interfaces above
        harness:
            devices:
                raspi_bt_client:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        bluetooth:
                            type: 'bluetooth.pybluez'
                            shell: 'linux_shell'
                        mqtt:
                            type: 'mqtt.server.mosquitto_linux'
                            shell: 'linux_shell'
                            server_listen_address: '0.0.0.0'
                            port: 1883
                            interface: 'wlan0'
                            tls_enabled: false
                        wifi:
                            # The 'wifi.access_points.linux' device type represents a linux-based access point
                            # running hostapd to create a soft AP
                            type: 'wifi.access_points.linux'
                            shell: 'linux_shell'
                            interface: 'wlan0'
            defaults: { }

    secondary_raspi_ble_client:
        interfaces:
            docker_host:
                type: 'docker'
                ip_address: '10.207.18.55'       #configure secondary Rpi rd_1 IP address
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True
            shell:
                type: 'rpc.rpc_client'
                # the 'forward_to' property specifies the destination device and interface on the server
                # the format is 'device:interface'
                forward_to: 'raspi_ble_client:linux_shell'
                host: 'docker_host'

            bluetooth:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_ble_client:bluetooth'
                host: 'docker_host'
        harness:
            devices:
                raspi_ble_client:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        bluetooth:
                            type: 'bluetooth.bluez'
                            shell: 'linux_shell'
            defaults: { }

    secondary_raspi:
        interfaces:
            # the docker_host interface specifies which device to connect to, login credentials, and
            # the docker image to run
            docker_host:
                type: 'docker'
                ip_address: '192.168.150.180'
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True

            # these are the RPC-enabled interfaces that will forward all method and property access
            # calls over to the respective instance on the server
            shell:
                type: 'rpc.rpc_client'
                # the 'forward_to' property specifies the destination device and interface on the server
                # the format is 'device:interface'
                forward_to: 'raspi_bt_client:linux_shell'
                host: 'docker_host'

            http:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_http_server:http'
                host: 'docker_host'

            http_client:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_http_client:http_client'
                host: 'docker_host'

            bluetooth:
                type: 'rpc.rpc_client'
                forward_to: 'raspi_ble_client:bluetooth'
                host: 'docker_host'


        # this section represents the harness configuration for the server side.
        # the devices and interfaces here will be created on-demand by the server
        # and can be used by the rpc_client-based interfaces above
        harness:
            devices:
                raspi_http_server:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        http:
                            type: 'http.server.http_linux'
                            shell: 'linux_shell'
                            port: 80
                            interface: 'eth0'

                raspi_http_client:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        http_client:
                            type: 'http.client.requests_client'
                            disable_certificate_verification: True

                raspi_ble_client:
                    interfaces:
                        linux_shell:
                            type: 'shell.shell'
                        bluetooth:
                            type: 'bluetooth.bluez'
                            shell: 'linux_shell'
            defaults: { }

    # this represents an MQTT broker running on the raspberry pi on port 1883 with no authentication enabled
    raspi_mosquitto:
        interfaces:
            # the docker_host interface specifies which device to connect to, login credentials, and
            # the docker image to run
            docker_host:
                type: 'docker'
                ip_address: '192.168.150.180'
                image: 'utfsilabs/rpi_ubuntu_secondary:2026_02_03'
                username: pi
                password: 'raspberry'
                skip_rabbitmq_check: True

            mqtt:
                type: 'mqtt.server.rpc_client'
                forward_to: 'raspi_mosquitto:mqtt'
                host: 'docker_host'

        # this section represents the harness configuration for the server side.
        # the devices and interfaces here will be created on-demand by the server
        # and can be used by the rpc_client-based interfaces above
        harness:
            devices:
                raspi_mosquitto:
                    interfaces:
                        linux_shell:
