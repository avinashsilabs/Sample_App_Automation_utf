   # This represents another access point configuration.
    raspi_wifi:
        interfaces:
            linux_shell:
                type: 'shell.shell'
            mqtt:
                type: 'mqtt.client.paho_client'
            wifi:
                # The 'wifi.access_points.linux' device type represents a linux-based access point
                # running hostapd to create a soft AP
                type: 'wifi.access_points.linux'
                shell: 'linux_shell'
                ssid: 'TESTTESTTEST'
                passphrase: 'thisisatestnetwork'
                supports: ['wifi_ap', 'wifi_client']
                interface: 'wlan0'


    raspi_ble_client:
        interfaces:
            bluetooth:
                type: 'bluetooth.pygatt'

    raspi_mosquitto:
        interfaces:
            linux_shell:
                type: 'shell.shell'
            mqtt:
                type: 'mqtt.server.mosquitto_linux'
                shell: 'linux_shell'
                server_listen_address: '0.0.0.0'
                port: 1883
                interface: 'wlan0'

# The entries in the defaults section define the default devices used in the test system, as well as default
# settings for interface types
defaults:
    # The dut entry is required and should be set to the name of the device representing the
    # device under test in the "devices" section
    dut: 'rs9116'
    efx32: 'efr32_4180b'

    # The wifi_access_point entry is needed for any test cases that require the wifi_accesspoint fixture
    # This should be set to the name of the device in the "devices" section to be used as an access point
#   wifi_access_point: 'raspi_wifi'
    #wifi_access_point: 'dlink_ap'

    # The wifi_client entry is needed for any test cases that require the wifi_client fixture
    # This should be set to the name of the device in the "devices" section to be used as a wifi client
    # (needed in order to test the host AP mode on the DUT)
#    wifi_client: 'raspi_wifi'
#    ble_client: 'raspi_ble_client'
#    mqtt_server: 'raspi_mosquitto'
#    mqtt_client: 'raspi_wifi'

    # The entries below define the defaults for the interface types corresponding to the entry name
    serial:
        baud: 115200

#    wifi:
#        ssid: 'TESTTESTTEST'
#        security: WPA2
#        channel: 1
#        passphrase: 'thisisatestnetwork'
#        server_ip: '192.168.0.1'

    bluetooth:
        ble_address: '03:04:05:06:07:08'
        ble_advertising_data: 'HELLO'

# The logger section is optional and can be used to modify the logging level for different modules
logger:
    DLink810AccessPoint: DEBUG

tools:
    iperf2:
        # to zip all the iperf output files
        zip_results: 'Y'
        server_params:
            # seconds between periodic bandwidth reports
            interval: 1
            # time in seconds to listen for new connections as well as to receive traffic (default not set)
            time: 30
        client_params:
            # used only for UDP as there is no limit imposed while TCP
            bandwidth: 0.1M
            interval: 1
            #time in seconds to transmit for (default 10 secs)
            time: 30
#        host:
#            # ip_address: ""
#            # currently, solution is reading it as IP address of Host
#            TCP:
#                port: 5201
#            UDP:
#                port: 5202
        device:
            # currently, solution is reading it as IP address of Device
            # ip_address: ""
            TCP:
                port: 1234
                data_len: 1460
            UDP:
                port: 1235
                # bytes, number of bytes we want device to send to server (host) in each iteration
                data_len: 1472
