tools:
  iperf2:
    host:
      TCP:
        port: 5201
      UDP:
        port: 5202
      network_interface: eth1
    device:
      TCP:
        port: 1234
        data_len: 1460
      UDP:
        port: 1235
        data_len: 1472
    zip_results: 'Y'
    client_params:
      time: 10
      interval: 1
      bandwidth: 0.1M
    server_params:
      time: 10
      interval: 1
devices:
  airpcap:
    interfaces:
      capture:
        type: wifi.sniffer.tshark
        shell: local_shell
        default: null
        interface: wlx9848279ff89f
      local_shell:
        type: shell.ssh_shell
        remote: 10.4.1.153
        password: raspberry
        username: pi
        use_paramiko_expect: false
  rs9116_at:
    type: rs911x
    defaults:
      cli_transport: uart
      gpio_transport: gpio_uart
    interfaces:
      uart:
        pid: 24577
        vid: 1027
        port: auto
        type: serial
      wifi:
        type: cli.rs_at_commands
      gpio_uart:
        pid: 261
        vid: 4966
        port: auto
        type: serial
      firmware_uart:
        pid: 24577
        vid: 1027
        port: auto
        type: serial
  savage_ap:
    interfaces:
      wifi:
        ssid: Savage-Test
        type: wifi.access_points.static
        channel: 11
        security: WPA2
        passphrase: F6E49FCE
  raspi_wifi:
    interfaces:
      mqtt:
        type: mqtt.client.paho_client
      wifi:
        type: wifi.access_points.linux
        shell: linux_shell
        interface: wlan0
      linux_shell:
        type: shell.shell
  dlink810_ap:
    interfaces:
      wifi:
        ssid: TESTTEST-DLINK
        type: wifi.access_points.dlink810
        ip_address: 10.4.1.178
        web_ui_port: 8080
        admin_password: dlink810l
  efr32_4180b:
    type: efx32
    interfaces:
      vcom:
        pid: 261
        vid: 4966
        port: auto
        type: serial
  rs9116_sapi:
    type: rs911x
    defaults:
      cli_transport: uart
      gpio_transport: uart
    interfaces:
      uart:
        pid: 261
        vid: 4966
        port: auto
        type: serial
      wifi:
        type: cli.rs_sapi_commands
      firmware_uart:
        pid: 24577
        vid: 1027
        port: auto
        type: serial
  static_http:
    interfaces:
      http:
        port: 443
        type: http.server.static
        hostname: reports.savage.zone
        tls_enabled: true
        tls_ca_chain: isrg-root.pem
  raspi_lighttpd:
    interfaces:
      http:
        port: 80
        type: http.server.http_linux
        shell: linux_shell
        interface: wlan0
      linux_shell:
        type: shell.shell
  raspi_bt_client:
    interfaces:
      bluetooth:
        type: bluetooth.pybluez
        shell: linux_shell
      linux_shell:
        type: shell.shell
  raspi_mosquitto:
    interfaces:
      mqtt:
        port: 1883
        type: mqtt.server.mosquitto_linux
        shell: linux_shell
        interface: wlan0
        tls_enabled: false
        server_listen_address: 0.0.0.0
      linux_shell:
        type: shell.shell
  raspi_ble_client:
    interfaces:
      bluetooth:
        type: bluetooth.bluez
        shell: linux_shell
      linux_shell:
        type: shell.shell
  raspi_http_client:
    interfaces:
      http:
        type: http.client.requests_client
        disable_certificate_verification: false
  raspi_lighttpd_tls:
    interfaces:
      http:
        port: 443
        type: http.server.http_linux
        shell: linux_shell
        tls_key: mosquitto-utf.silabs.com.key.pem
        interface: wlan0
        tls_enabled: true
        tls_ca_chain: ca-chain.cert.pem
        tls_certificate: mosquitto-utf.silabs.com.cert.pem
      linux_shell:
        type: shell.shell
  static_mqtt_broker:
    interfaces:
      mqtt:
        port: 1883
        type: mqtt.server.static
        hostname: mqtt.savage.zone
        password: TESTTESTTEST
        username: utfsilabs
        tls_enabled: false
  raspi_mosquitto_tls:
    interfaces:
      mqtt:
        port: 8883
        type: mqtt.server.mosquitto_linux
        shell: linux_shell
        tls_key: mosquitto-utf.silabs.com.key.pem
        password: testpassword
        username: testuser
        interface: wlan0
        tls_enabled: true
        tls_ca_chain: ca-chain.cert.pem
        tls_certificate: mosquitto-utf.silabs.com.cert.pem
        server_listen_address: 0.0.0.0
      linux_shell:
        type: shell.shell
  python_aws_iot_thing:
    interfaces:
      aws_iot:
        port: 8883
        type: aws_iot.python_thing
        root_ca: AWS-IoT-root-CA.crt
        hostname: a2lqafhldpb41r-ats.iot.us-east-1.amazonaws.com
        client_id: Python-Thing
        client_cert: python-thing-certificate.pem.crt
        private_key: python-thing-private.pem.key
  raspi_mosquitto_auth:
    interfaces:
      mqtt:
        port: 1883
        type: mqtt.server.mosquitto_linux
        shell: linux_shell
        password: testpassword
        username: testuser
        interface: wlan0
        tls_enabled: false
        server_listen_address: 0.0.0.0
      linux_shell:
        type: shell.shell
  secondary_raspi_bt_client:
    harness:
      devices:
        raspi_bt_client:
          interfaces:
            mqtt:
              port: 1883
              type: mqtt.server.mosquitto_linux
              shell: linux_shell
              interface: wlan0
              tls_enabled: false
              server_listen_address: 0.0.0.0
            wifi:
              type: wifi.access_points.linux
              shell: linux_shell
              interface: wlan0
            bluetooth:
              type: bluetooth.pybluez
              shell: linux_shell
            linux_shell:
              type: shell.shell
      defaults: {}
    interfaces:
      mqtt:
        host: docker_host
        type: rpc.rpc_client
        forward_to: raspi_bt_client:mqtt
      wifi:
        host: docker_host
        type: rpc.rpc_client
        forward_to: raspi_bt_client:wifi
      shell:
        host: docker_host
        type: rpc.rpc_client
        forward_to: raspi_bt_client:linux_shell
      bluetooth:
        host: docker_host
        type: rpc.rpc_client
        forward_to: raspi_bt_client:bluetooth
      docker_host:
        type: docker
        image: utfsilabs/rpi_ubuntu_secondary:09_02_2021
        password: raspberry
        username: pi
        ip_address: 10.4.1.153
defaults:
  dut: rs9116_at
  wifi:
    ssid: TESTTESTTEST
    channel: 1
    security: WPA2
    server_ip: 192.168.0.1
    passphrase: thisisatestnetwork
    ping_timeout: 4
    num_ping_attempts: 10
  efx32: efr32_4180b
  serial:
    baud: 115200
  aws_iot:
    port: 8883
    cafile: AWS-IoT-root-CA.crt
    keyfile: python-thing-private.pem.key
    certfile: python-thing-certificate.pem.crt
    hostname: a2lqafhldpb41r-ats.iot.us-east-1.amazonaws.com
    client_id: Python-Thing
    thing_name: Python-Thing
  bluetooth:
    bt_pin_code: '4321'
    bt_local_name: rs911x_bt_spp
    ble_advertising_data: HELLO
  bt_client: raspi_bt_client
  ble_client: raspi_ble_client
  http_client: raspi_http_client
  http_server: raspi_lighttpd
  mqtt_client: raspi_wifi
  mqtt_server: raspi_mosquitto
  wifi_client: raspi_wifi
  wifi_sniffer: airpcap
  wifi_access_point: dlink810_ap
end_state:
  wifi_access_point:
    wifi: ap_disabled
integration:
  duts:
    - rs9116_sapi
    - rs9116_at
  access_points:
    - raspi_wifi
    - dlink810_ap
    - asus_rt_ax3000_ap
start_state:
  wifi_dut:
    wifi: init
    device: reset
  wifi_access_point:
    wifi: ap_enabled
