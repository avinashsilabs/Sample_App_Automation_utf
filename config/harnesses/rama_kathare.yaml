# This is an example of a harness configuration file that describes the hardware for the test
# station and defines default settings for the devices.
# The format of this file is YAML ( https://yaml.org/ ) and the schema
# is defined in the file schema.json in the same folder as this file

devices:

    # Entries in the devices section can have arbitrary names, but they must be unique.
    # The names of the devices are referenced below in the "defaults" section.

    # This entry represents an example of an rs9116 device configuration.
    # Note that the 'dut' entry in the 'defaults' section toward the bottom of this
    # file refers to this device entry
    rs9116_at:

        # The 'type' attribute is optional.  If it is present, the device will be created via a
        # create_device() function located in the corresponding python module under the 'devices'
        # folder.
        # If this attribute is not present, the device will be created as an instance of the Device or CompositeDevice class
        # In the case of a 9116 device, the type 'rs911x' should be used
        type: 'rs911x'
        subtype: 'rs9116'
        src_dir: 'utf_wiseconnect'

        # The 'defaults' attribute is optional and can be used to specify default attributes for this device instance
        defaults:
            cli_transport: 'uart'
            gpio_transport: 'gpio_uart'

        # The 'interfaces' attribute is mandatory to describe the control interfaces/functionality of the device
        interfaces:

            # Like the top level device names, the interface names are also arbitrary, but must be unique for a
            # given device
            uart:
                # The type attribute is mandatory and specifies the module within the interfaces folder
                # used to create the interface object
                type: 'serial'

                # Other attributes are specific to the interface type; some may be optional or mandatory
                # For a serial uart device connected via USB, you can enable autodetection of the port
                # by specifying the vid and pid of the device.
                # In the below example, the vid and pid represent the 9116's 'UART' port
                port: 'auto'
                vid: 0x0403
                pid: 0x6001

            # 'firmware_uart' is a special interface that indicates which UART is used
            # when loading firmware on the device
            # If this is not present, "uart" will be used as the default.
            firmware_uart:
                type: 'serial'

                # See notes above for autodetection rules.  The vid and pid below represent the
                # 'UART' USB connector on the 9116 board.
                port: 'auto'
                vid: 0x0403
                pid: 0x6001

            # 'gpio_uart' is a special interface that indicates which UART is used
            # for GPIO control with the AT command set.
            # Typically this will be the UART for the EFx32 device.
            gpio_uart:
                type: 'serial'
                port: 'auto'
                vid: 0x1366
                pid: 0x0105

            wifi:
                # the wifi interface type for the 9116 must be either
                # 'cli.rs_at_commands' or 'cli.rs_sapi_commands'
                # Both of these (or any interface of type 'cli') require a 'cli_transport' property
                # to be defined in the defaults section for specifying the
                # communication interface to the device
                type: 'cli.rs_at_commands'
                src_dir: 'utf_wiseconnect'
                # reset type
                # this mechanism is applied when the wifi_dut fixture is created.
                # null (or parameter not present) - do not reset device when creating interface
                # hard - use physical reset line to reset device
                #   - this requires the gpio_transport to be configured
                # soft - use software initiated reset, if available

    rs9116_sapi:

        # The 'type' attribute is optional.  If it is present, the device will be created via a
        # create_device() function located in the corresponding python module under the 'devices'
        # folder.
        # If this attribute is not present, the device will be created as an instance of the Device or CompositeDevice class
        # In the case of a 9116 device, the type 'rs911x' should be used
        type: 'rs911x'
        subtype: 'rs9116'
        src_dir: 'utf_wiseconnect'

        # The 'defaults' attribute is optional and can be used to specify default attributes for this device instance
        defaults:
            cli_transport: 'uart'
            gpio_transport: 'uart'

        # The 'interfaces' attribute is mandatory to describe the control interfaces/functionality of the device
        interfaces:

            # Like the top level device names, the interface names are also arbitrary, but must be unique for a
            # given device
            uart:
                # The type attribute is mandatory and specifies the module within the interfaces folder
                # used to create the interface object
                type: 'serial'

                # Other attributes are specific to the interface type; some may be optional or mandatory
                # For a serial uart device connected via USB, you can enable autodetection of the port
                # by specifying the vid and pid of the device.
                # In the below example, the vid and pid represent the USB connection to the WSTK
                port: 'auto'
                vid: 0x1366
                pid: 0x0105

            # 'firmware_uart' is a special interface that indicates which UART is used
            # when loading firmware on the device
            # If this is not present, "uart" will be used as the default.
            firmware_uart:
                type: 'serial'

                # See notes above for autodetection rules.  The vid and pid below represent the
                # 'UART' USB connector on the 9116 board.
                port: 'auto'
                vid: 0x0403
                pid: 0x6001

            wifi:
                # the wifi interface type for the 9116 must be either
                # 'cli.rs_at_commands' or 'cli.rs_sapi_commands'
                # Both of these (or any interface of type 'cli') require a 'cli_transport' property
                # to be defined in the defaults section for specifying the
                # communication interface to the device
                type: 'cli.rs_sapi_commands'
                src_dir: 'utf_wiseconnect'

    efr32_4180b:
        type: 'efx32'
        subtype: 'efr32'
        interfaces:
            vcom:
                type: 'serial'
                port: 'auto'
                vid: 0x1366
                pid: 0x0105

    dlink810_ap:
        interfaces:
            wifi:
                type: 'wifi.access_points.dlink810'
                ip_address: '10.207.16.95'
                web_ui_port: 8080
                admin_password: 'bhuvgycft'
                ssid: "TESTTEST-DLINK_3"
                channel: 1
                cipher: 'AES'

    dlink810_ap_static:
        interfaces:
            wifi:
                type: 'wifi.access_points.static'
                security: WPA2
                ssid: 'TESTTEST-DLINK_3'
                passphrase: 'thisisatestnetwork'
                channel: 1
                cipher: 'AES'

    binatone_static_ap:
        interfaces:
            wifi:
                type: 'wifi.access_points.static'
                security: WPA2
                ssid: 'binatone_dt910w'
                passphrase: 'thisisatestnetwork'
                channel: 1
                cipher: 'AES'

    asus_rt_ax3000_ap:
        interfaces:
            wifi:
                type: 'wifi.access_points.asus_rt_ax3000'
                ip_address: '10.4.1.189'
                admin_password: 'www.ni.com'
                ssh_port: 1022
                ssid: "TESTTEST-ASUS"

    switched_ap:
        interfaces:
            wifi:
                type: 'wifi.access_points.static'
                ssid: "Savage-Test"
                security: 'WPA2'
                channel: 11
                passphrase: 'F6E49FCE'
                switch_config: 'pdu_switch'
            pdu_switch:
                # switch type is Digital Logging v222
                type: 'switch.dli_v222_pdu'
                hostname: '192.168.2.4'
                user: 'admin'
                password: '1234'
                # valid outlet numbers are 1-8
                outlet: 1
                # use_persistent_state: true will set a persistent state, that the outlet will revert
                # to after reboot or power cycle
                # use_persistent_state: false will set a transient state only, and the outlet will revert
                # back to the persistent state after reboot or power cycle
                use_persistent_state: false

    # This represents another access point configuration.
    raspi_wifi:
        interfaces:
            linux_shell:
                type: 'shell.shell'
            mqtt:
                type: 'mqtt.client.paho_client'
            wifi:
                # The 'wifi.access_points.linux' device type represents a linux-based access point
                # running hostapd to create a soft AP
                type: 'wifi.access_points.linux'
                shell: 'linux_shell'
                interface: 'wlan0'

    secondary_raspi_client:
        interfaces:
            linux_shell:
                type: 'shell.ssh_shell'
                remote: 192.168.14.3
                username: pi
                password: raspberry
                use_paramiko_expect: false
            wifi:
                type: 'wifi.access_points.linux'
                shell: 'linux_shell'
                interface: 'wlan0'

    raspi_ble_client:
        interfaces:
            linux_shell:
                type: 'shell.shell'
            bluetooth:
                type: 'bluetooth.bluez'
                shell: 'linux_shell'


    raspi_multicast:
                buffer_length: 1470
                no_of_pkts: 500
                socket_type: 0   #0- TCP, 1 - UDP
                interface: 'eth0'

    ip_socket_factory:
        interfaces:
            socket:
                type: 'socket.ip_socket_factory'


# The entries in the defaults section define the default devices used in the test system, as well as default
# settings for interface types
defaults:
    # The dut entry is required and should be set to the name of the device representing the
    # device under test in the "devices" section
    dut: 'rs9116_sapi'

    efx32: 'efr32_4180b'

    # List of devices on test bed, used for loading/upgrading firmware at test case level
    wiseconnect_duts:
        - 'rs9116_sapi'
        - 'efr32_4180b'

    # The wifi_access_point entry is needed for any test cases that require the wifi_access_point fixture
    # This should be set to the name of the device in the "devices" section to be used as an access point
    wifi_access_point: 'binatone_static_ap'

    # To connect the multiple access points
    wifi_access_points:
        - 'raspi_wifi'
        - 'static_ap'
    # The wifi_client entry is needed for any test cases that require the wifi_client fixture
    # This should be set to the name of the device in the "devices" section to be used as a wifi client
    # (needed in order to test the host AP mode on the DUT)
    wifi_client: 'raspi_wifi'

    wifi_clients:
        - 'raspi_wifi'
        - 'secondary_raspi_client'

    wifi_sniffer: 'airpcap'

    logic_analyzer: 'saleae_logic_analyzer'

    power_meter: 'keysight_power_analyzer'

    bt_client: 'raspi_bt_client'
    ble_client: 'raspi_ble_client'

    ble_clients:
        - 'secondary_raspi_ble_client'
        - 'raspi_ble_client'

    mqtt_server: 'raspi_mosquitto'

    mqtt_client: 'raspi_wifi'

    http_server: 'raspi_lighttpd'

    http_client: 'raspi_http_client'

    rf_attenuator: '50pa500_attenuator'

    ssl_server: 'raspi_ssl_server'

    remote_socket: 'raspi_ip_socket'
    #ssl_server: 'raspi_ssl_server_static'
    #ssl_client: 'raspi_ssl_client'

    aws_iot_client: 'python_aws_iot_thing'

    wiseconnect_web: 'wiseconnect_web'

    net_perf_client: 'raspi_iperf'

    wiseconnect_ui:
        mode: 'Client'
        band: '2.4'
        ssid: 'TESTTESTTEST'
        passphrase: 'thisisatestnetwork'
        channel: 1

    # The entries below define the defaults for the interface types corresponding to the entry name
    serial:
        baud: 115200

    wifi:
        ssid: 'TESTTESTTEST_3'
        security: WPA2
        channel: 1
        passphrase: 'thisisatestnetwork'
        server_ip: '192.168.0.1'
        num_ping_attempts: 10
        ping_timeout: 4

        static_ip: '192.168.14.200'
        static_subnet: '255.255.255.0'
        static_gateway: '192.168.14.1'

    bluetooth:
        #ble_address: '03:04:05:06:07:08'
        ble_advertising_data: 'HELLO'
        bt_local_name: "rs911x_bt_spp"
        bt_pin_code: "4321"

    iop_sockets:
        server_ip: '192.168.10.212'
        server_port: '6001'
        att_channel: 1
        db_value: 2
        att_enable: true

    aws_iot:
        hostname: "a2lqafhldpb41r-ats.iot.us-east-1.amazonaws.com"
        port: 8883
        client_id: "Python-Thing"
        thing_name: "Python-Thing"
        certfile: "python-thing-certificate.pem.crt"
        keyfile: "python-thing-private.pem.key"
        cafile: "AWS-IoT-root-CA.crt"

    net_perf:
        server_options:
            # seconds between periodic bandwidth reports
            interval: 1
            # time in seconds to listen for new connections as well as to receive traffic (default not set)
            time: 30
        client_options:
            # used only for UDP as there is no limit imposed while TCP
            bandwidth: 0.1M
            interval: 1
            #time in seconds to transmit for (default 10 secs)
            time: 30
        host:
            TCP:
                port: 5201
            UDP:
                port: 5202
        device:
            # currently, solution is reading it as IP address of Device
            # ip_address: ""
            TCP:
                port: 1234
                data_len: 1460
            UDP:
                port: 1235
                # bytes, number of bytes we want device to send to server (host) in each iteration
                data_len: 1472
        tos_value: '0xC8'

# The logger section is optional and can be used to modify the logging level for different modules
logger:
    DLink810AccessPoint: DEBUG

# default start & end states for devices & interfaces
start_state:
    wifi_access_point:
        wifi: 'ap_enabled'
    wifi_dut:
        device: 'reset'
        wifi: 'init'

end_state:
    wifi_access_point:
        wifi: 'ap_disabled'