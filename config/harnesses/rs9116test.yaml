devices:
  rs9116:
    type: 'rs911x'
    defaults:
      cli_transport: 'uart'
      gpio_transport: 'gpio_uart'
    interfaces:
      uart:
        type: 'serial'
        port: 'auto'
        vid: 0x0403
        pid: 0x6001
        
      gpio_uart:
        type: 'serial'
        port: 'auto'
        vid: 0x1366
        pid: 0x0105

      wifi:
        type: 'cli.rs_at_commands'
        # reset: 'soft'

  rs9116_sapi:
    type: 'rs911x'
    defaults:
      cli_transport: 'uart'
      gpio_transport: 'uart'
    interfaces:
      firmware_uart:
        type: 'serial'
        port: 'auto'
        vid: 0x0403
        pid: 0x6001

      uart:
        type: 'serial'
        port: 'auto'
        vid: 0x1366
        pid: 0x0105
      wifi:
        type: 'cli.rs_sapi_commands'
        reset: 'soft' 

  efr32_4180b:
    type: 'efx32'
    interfaces:
      vcom:
        type: 'serial'
        port: 'auto'
        vid: 0x1366
        pid: 0x0105
  
  raspi_ble_client:
    interfaces:
      linux_shell:
        type: 'shell.shell'
      bluetooth:
        type: 'bluetooth.bluez'
        shell: 'linux_shell'

  raspi_bt_client:
    interfaces:
      linux_shell:
        type: 'shell.shell'
      bluetooth:
        type: 'bluetooth.pybluez'
        shell: 'linux_shell'

  guest_ap:
    interfaces:
      wifi:
        type: 'wifi.access_points.static'
        ssid: 'TESTTESTTEST'
        passphrase: 'thisisatestnework'
        supports: 'wifi_ap'

  raspi_wifi:
    interfaces:
      linux_shell:
        type: 'shell.shell'

      mqtt:
        type: 'mqtt.client.paho_client'

      wifi:
        type: 'wifi.access_points.linux'
        shell: 'linux_shell'
        ssid: 'TESTTESTTEST'
        passphrase: 'thisisatestnework'
        supports: ['wifi_ap', 'wifi_client']
        interface: 'wlan0'

  raspi_mosquitto:
    interfaces:
      linux_shell:
        type: 'shell.shell'
      mqtt:
        type: 'mqtt.server.mosquitto_linux'
        shell: 'linux_shell'
        server_listen_address: '0.0.0.0'
        port: 1883
        interface: 'wlan0'
        tls_enabled: false

raspi_mosquitto_auth:
  interfaces:
    linux_shell:
      type: 'shell.shell'
    mqtt:
      type: 'mqtt.server.mosquitto_linux'
      shell: 'linux_shell'
      server_listen_address: '0.0.0.0'
      port: 1883
      interface: 'wlan0'
      username: 'testuser'
      password: 'testpassword'
      tls_enabled: false

raspi_mosquitto_tls:
  interfaces:
    linux_shell:
      type: 'shell.shell'
    mqtt:
      type: 'mqtt.server.mosquitto_linux'
      shell: 'linux_shell'
      server_listen_address: '0.0.0.0'
      port: 8883
      interface: 'wlan0'
      username: 'testuser'
      password: 'testpassword'
      tls_enabled: true
      tls_key: 'mosquitto-utf.silabs.com.key.pem'
      tls_certificate: 'mosquitto-utf.silabs.com.cert.pem'
      tls_ca_chain: 'ca-chain.cert.pem'

static_mqtt_broker:
  interfaces:
    mqtt:
      type: 'mqtt.server.static'
      hostname: 'mqtt.savage.zone'
      port: 1883
      username: 'utfsilabs'
      password: 'TESTTESTTEST'
      tls_enabled: false


defaults:
  dut: 'rs9116'
  
  wifi_access_point: 'raspi_wifi'
  wifi_client: 'raspi_wifi'

  efx32: 'efr32_4180b'

  ble_client: 'raspi_ble_client'

  bt_client: 'raspi_bt_client'

  mqtt_server: 'raspi_mosquitto'
  mqtt_client: 'raspi_wifi'

  serial:
    baud: 115200

  wifi:
    ssid: 'TESTTESTTEST'
    security: WPA2
    channel: 1
    passphrase: 'thisisatestnework'
    server_ip: '192.168.0.1'
    num_ping_attempts: 10
    ping_timeout: 4

  bluetooth:
    ble_advertising_data: 'HELLO'
    bt_local_name: "rs911x_bt_spp"
    bt_pin_code: "4321"

  
tools:
  iperf2:
    zip_results: 'Y'
    server_params:
        # seconds between periodic bandwidth reports
        interval: 1
        # time in seconds to listen for new connections as well as to receive traffic (default not set)
        time: 10
    client_params:
      # used only for UDP as there is no limit imposed while TCP
      bandwidth: 0.1M
      interval: 1
      #time in seconds to transmit for (default 10 secs)
      time: 10
    host:
      # ip_address: ""
      # currently, solution is reading it as IP address of Host
      TCP:
        port: 5201
      UDP:
        port: 5202
    device:
      # currently, solution is reading it as IP address of Device
      # ip_address: ""
      TCP:
        port: 1234
        data_len: 1460
      UDP:
        port: 1235
        # bytes, number of bytes we want device to send to server (host) in each iteration
        data_len: 1472

start_state:
  wifi_access_point:
    wifi: 'ap_enabled'
  wifi_dut:
    device: 'reset'
    wifi: 'init'

end_state:
  wifi_access_point:
    wifi: 'ap_disabled'





